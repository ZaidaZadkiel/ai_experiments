<script>
  // Browser copy of normalizeName in src/name-rule.js (FR-6).
  // Keep the two in step: test/name-rule.test.js checks they give the same results.
  function normalizeName(raw) {
    const MAX_NAME_LENGTH = 50;
    const HTML_ENTITIES = {
      "<": "&lt;",
      ">": "&gt;",
      "&": "&amp;",
      '"': "&quot;",
      "'": "&#39;",
    };
    const URL_CHARACTERS = "?#%+/=";

    function convertCharacter(character) {
      if (Object.hasOwn(HTML_ENTITIES, character))
        return HTML_ENTITIES[character];
      if (URL_CHARACTERS.includes(character)) return "_";
      const code = character.codePointAt(0);
      if (code >= 32 && code <= 126) return character;
      return "_";
    }

    const trimmed = String(raw ?? "")
      .replace(/^ +/, "")
      .replace(/ +$/, "");
    const characters = Array.from(trimmed).slice(0, MAX_NAME_LENGTH);
    while (characters.length > 0 && characters[characters.length - 1] === " ") {
      characters.pop();
    }
    return characters.map(convertCharacter).join("");
  }

  // How a normalized name looks on a page: entities show as their characters.
  function displayName(normalized) {
    const characters = {
      lt: "<",
      gt: ">",
      amp: "&",
      quot: '"',
      "#39": "'",
    };
    return normalized.replace(
      /&(lt|gt|amp|quot|#39);/g,
      (match, entity) => characters[entity],
    );
  }

  // Show what the server will save. Never blocks submitting (FR-6).
  if (typeof document !== "undefined") {
    for (const input of document.querySelectorAll('input[name="name"]')) {
      const message = input.form?.querySelector("[data-name-rule-message]");
      if (!message) continue;
      input.addEventListener("input", () => {
        const value = input.value;
        const normalized = normalizeName(value);
        if (value === "") {
          message.textContent = "";
        } else if (normalized === "") {
          message.textContent = "This name has no usable characters.";
        } else {
          const shown = displayName(normalized);
          message.textContent =
            shown === value ? "" : `This name will be saved as: ${shown}`;
        }
      });
    }
  }
</script>
